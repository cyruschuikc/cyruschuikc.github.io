    <meta name="description" content="Customized 3col. RGB divider strip" />
    <title>RE:Colbar-mini</title>
      <style>
        body, main, .vsframe
        {
          padding: 0;
          margin: 0;
        }
        .colbar-container
        {
          padding: 0;
          margin: 0;
          width: 100%;
          height: 30px;

          padding: 0;
          margin: 0;
          width: 100%;
        }
        #cbs-colR
        {
          padding: 0;
          margin: 0;
          width: 33.33%;
          height: 10px;

        #cbs-colG
        {
          padding: 0;
          margin: 0;
          width: 33.33%;
          height: 10px;
          background-color: #37d366;
        }
        #cbs-colB
        {
          padding: 0;
          margin: 0;
          width: 33.33%;
          height: 10px;
          background-color: #0037ff;
        }
      </style>
  </head>
  <body>
    <main>
      <section class="vsframe" name="colbar-frame" id="colbar">
        <table class="colbar-container" id="container-cb">
          <tr class="cbStrip">
            <td id="cbs-colR"></td>
            <td id="cbs-colG"></td>
            <td id="cbs-colB"></td>
          </tr>
        </table>
      </section>
