<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="author" content="cyruschuikc" />
        <meta name="copyright" content="&copy;&nbsp;&nbsp;2026. cyruschuikc. all rights reserved." />
        <meta name="description" content="Customized 3col. RGB divider strip" />
        <title>Colbar-me</title>
        <style>
            /* Reset & layout structure for full-width presentation */
            body {
                margin: 0;
                padding: 0;
            }

            /* Modern CSS Flexbox approach (Recommended) */
            .rgb-divider {
                display: flex;
                width: 100%;
                height: 6px; /* Adjust height as needed */
            }

            .rgb-divider .red { background-color: #ff0000; }
            .rgb-divider .green { background-color: #00ff00; }
            .rgb-divider .blue { background-color: #0000ff; }

            .rgb-divider > div {
                flex: 1; /* Assigns equal 33.33% width to each color segment */
            }

            /* Legacy Table approach styling (Fixed version of your original code) */
            .myDivStrip {
                width: 100%;
                border-collapse: collapse;
                border-spacing: 0;
                height: 6px;
                table-layout: fixed;
            }

            .myDivStrip td {
                width: 33.33%;
                padding: 0;
            }
        </style>
    </head>
    <body>

        <!-- Option 1: Modern Flexbox Divider (Cleaner & Better Practice) -->
        <div class="rgb-divider" role="separator" aria-label="Decorative RGB divider">
            <div class="red"></div>
            <div class="green"></div>
            <div class="blue"></div>
        </div>

        <br />

        <!-- Option 2: Table-based Divider (Fixed implementation) -->
        <table class="myDivStrip" role="presentation">
            <tr id="dsRow1">
                <td style="background-color: red;"></td>
                <td style="background-color: green;"></td>
                <td style="background-color: blue;"></td>
            </tr>
        </table>

    </body>
</html>
